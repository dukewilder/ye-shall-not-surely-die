<style>
  :root{--bone:#e8e6e0;--dim:#8a8880;--rule:#2e2e2b}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;color:var(--bone)}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    min-height:100svh;position:relative;overflow-x:hidden;text-align:center;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  /* One composition at every width: the figure large and centred, blurred back
     so the type reads over it. Desktop is the same page with wider margins.
     No CSS masks anywhere — mask-composite misbehaves on iOS. */
  /* the figure covers whatever screen it is on, like a background image, and
     the overflow is cropped at the viewport edges. The vignette then darkens
     those edges so nothing ever reads as a cut. No CSS masks: mask-composite
     misbehaves on iOS. */
  .figure{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .figure img{
    width:100%;height:100%;
    object-fit:cover;object-position:100% 42%;   /* flush right: the figure's
       own edge is the image's edge, so nothing is cut and no black sits beside it */
    filter:saturate(0) blur(8px);
    opacity:.6;
    transform:scale(1.06);            /* hides the blur's soft edge */
  }
  .figure::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(ellipse 78% 72% at 50% 44%,
        rgba(0,0,0,0) 0,rgba(0,0,0,.28) 48%,rgba(0,0,0,.82) 82%,#000 100%),
      linear-gradient(to bottom,rgba(0,0,0,.62) 0,rgba(0,0,0,.05) 22%,
        rgba(0,0,0,.05) 70%,rgba(0,0,0,.72) 100%);
  }
  main{
    position:relative;z-index:1;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:clamp(3.5rem,11vh,8rem) clamp(1.4rem,6vw,3rem) 4rem;
    width:100%;
  }
  h1,.sub,.obelus{text-shadow:0 2px 18px rgba(0,0,0,.75)}
  h1{margin:0;font-weight:400;text-transform:uppercase;
     font-size:clamp(2rem,6.1vw,10rem);line-height:1.06;letter-spacing:.055em}
  .obelus{color:var(--dim);margin:clamp(1.3rem,1.7vw,2.6rem) 0 clamp(1.15rem,1.5vw,2.3rem);line-height:1;
          font-size:clamp(1rem,2.1vw,3.6rem)}
  .sub{margin:0;font-style:italic;font-size:clamp(1rem,2.2vw,3.7rem)}
  .byline{margin:clamp(.85rem,1.1vw,1.7rem) 0 0;font-size:clamp(.76rem,1.02vw,1.75rem);letter-spacing:.22em;
          text-transform:uppercase;color:#c9c7c0;
          text-shadow:0 1px 10px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8)}
  /* a grid sized to its own content with equal fr columns: every button ends
     up as wide as the widest label, while the padding stays tight */
  nav{margin:clamp(2.2rem,6vh,3.4rem) auto 0;
      display:grid;width:max-content;max-width:92vw;
      grid-auto-flow:column;grid-auto-columns:1fr;
      gap:clamp(.65rem,.8vw,1.5rem)}
  nav a{display:block;text-align:center;
        padding:.72em 1.25em;      /* em, so the border scales with the text */
        border:1px solid var(--rule);
        color:var(--bone);text-decoration:none;
        font-size:clamp(.72rem,.92vw,1.6rem);letter-spacing:.155em;
        text-shadow:0 1px 10px rgba(0,0,0,.85);
        text-transform:uppercase;white-space:nowrap;background:rgba(0,0,0,.42);
        transition:border-color .18s ease,background-color .18s ease}
  nav a:hover,nav a:focus-visible{border-color:var(--bone);
        background:rgba(232,230,224,.08);outline:none}
  nav a .free{color:var(--dim)}
  footer{margin-top:clamp(2.2rem,6vh,3.2rem);
         font-size:clamp(.72rem,.88vw,1.55rem);letter-spacing:.1em;
         text-shadow:0 1px 10px rgba(0,0,0,.85);
         color:var(--dim);text-transform:uppercase}
  footer a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--rule)}
  footer a:hover{color:var(--bone);border-bottom-color:var(--bone)}
  @media (max-width:820px){
    .figure img{opacity:.66;filter:saturate(0) blur(6px);object-position:100% 40%}
    main{min-height:auto;padding-top:8vh}
    nav{grid-auto-flow:row;grid-auto-columns:auto;width:max-content;
        margin-top:clamp(2rem,5.5vh,3rem)}
    nav a{white-space:nowrap}
    /* phones and portrait tablets get their own, larger scale. Nothing here can
       reach desktop, which begins at 821px. */
    h1{font-size:clamp(2.25rem,9.6vw,3rem)}
    .obelus{font-size:1.3rem;margin:1.15rem 0 1rem}
    .sub{font-size:1.22rem}
    .byline{font-size:.92rem;margin-top:.9rem}
    nav a{font-size:.88rem;padding:.8em 1.35em}
    footer{font-size:.84rem}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
